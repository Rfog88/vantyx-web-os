<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="HVAC concept — wall-mounted mini-split with cool airflow">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1626"/>
      <stop offset="0.6" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="0.5" stop-color="#9CA3AF"/>
      <stop offset="1" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="airflow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloomGlow" cx="40%" cy="30%" r="55%">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1920" height="800" fill="url(#wall)"/>
  <rect width="1920" height="800" fill="url(#bloomGlow)"/>

  <!-- floor band -->
  <rect x="0" y="660" width="1920" height="140" fill="#050912"/>
  <line x1="0" y1="660" x2="1920" y2="660" stroke="#1F2937" stroke-width="1" opacity="0.5"/>

  <!-- couch silhouette suggesting living space -->
  <rect x="240"  y="540" width="520" height="120" rx="14" fill="#1F2937"/>
  <rect x="260"  y="500" width="80"  height="60"  rx="10" fill="#1F2937"/>
  <rect x="660"  y="500" width="80"  height="60"  rx="10" fill="#1F2937"/>
  <line x1="240" y1="660" x2="760" y2="660" stroke="#0B1220" stroke-width="3"/>

  <!-- mini-split unit (upper right) -->
  <rect x="1180" y="200" width="540" height="130" rx="10" fill="url(#unit)" stroke="#374151" stroke-width="2"/>
  <rect x="1180" y="306" width="540" height="22"  rx="2"  fill="#374151"/>
  <!-- louver slats hint -->
  <g stroke="#1F2937" stroke-width="1.5">
    <line x1="1200" y1="316" x2="1700" y2="316"/>
    <line x1="1200" y1="322" x2="1700" y2="322"/>
  </g>
  <!-- digital display -->
  <rect x="1610" y="240" width="84" height="34" rx="3" fill="#0F172A"/>
  <text x="1652" y="266" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#7DD3FC" text-anchor="middle" letter-spacing="1">72°</text>
  <!-- brand bar -->
  <rect x="1200" y="218" width="180" height="6" rx="2" fill="#9CA3AF" opacity="0.6"/>

  <!-- airflow stripes -->
  <g filter="url(#soft)" opacity="0.85">
    <path d="M1240 332 Q1180 480 1080 580" stroke="url(#airflow)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M1340 332 Q1280 500 1180 600" stroke="url(#airflow)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M1440 332 Q1380 510 1280 620" stroke="url(#airflow)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M1540 332 Q1500 510 1400 620" stroke="url(#airflow)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M1640 332 Q1610 510 1520 610" stroke="url(#airflow)" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1920" height="800" fill="#000" opacity="0.18"/>

  <g font-family="Inter, system-ui, sans-serif" fill="#374151">
    <text x="1880" y="775" font-size="14" text-anchor="end" letter-spacing="2">VANTYX · CONCEPT</text>
  </g>
</svg>
