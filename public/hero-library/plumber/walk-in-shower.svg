<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plumber concept — walk-in shower with rainfall head">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="topLight" cx="50%" cy="0%" r="60%">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#7DD3FC" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1920" height="800" fill="url(#bg)"/>
  <rect width="1920" height="800" fill="url(#topLight)"/>

  <!-- large format tile wall (vertical slabs) -->
  <g fill="url(#tile)" stroke="#070B14" stroke-width="2">
    <rect x="0"    y="0" width="320" height="800"/>
    <rect x="320"  y="0" width="320" height="800"/>
    <rect x="640"  y="0" width="320" height="800"/>
    <rect x="960"  y="0" width="320" height="800"/>
    <rect x="1280" y="0" width="320" height="800"/>
    <rect x="1600" y="0" width="320" height="800"/>
  </g>

  <!-- glass divider hint, right side -->
  <rect x="1500" y="0" width="6" height="800" fill="#1F2937" opacity="0.7"/>

  <!-- rainfall shower head -->
  <rect x="900" y="60"  width="120" height="14" rx="3" fill="#0F172A" stroke="#1F2937" stroke-width="1"/>
  <rect x="954" y="20"  width="12"  height="46" fill="#0F172A"/>
  <circle cx="960" cy="20" r="6" fill="#1F2937"/>
  <!-- subtle head highlight -->
  <rect x="900" y="60" width="120" height="2" fill="#475569" opacity="0.5"/>

  <!-- falling water columns -->
  <g filter="url(#soft)">
    <rect x="908"  y="78" width="3" height="500" fill="url(#dropCol)"/>
    <rect x="922"  y="78" width="2" height="540" fill="url(#dropCol)"/>
    <rect x="936"  y="78" width="3" height="520" fill="url(#dropCol)"/>
    <rect x="950"  y="78" width="2" height="560" fill="url(#dropCol)"/>
    <rect x="964"  y="78" width="3" height="500" fill="url(#dropCol)"/>
    <rect x="978"  y="78" width="2" height="540" fill="url(#dropCol)"/>
    <rect x="992"  y="78" width="3" height="520" fill="url(#dropCol)"/>
    <rect x="1006" y="78" width="2" height="500" fill="url(#dropCol)"/>
  </g>

  <!-- floor reflection -->
  <rect x="0" y="660" width="1920" height="140" fill="#050912"/>
  <ellipse cx="960" cy="700" rx="220" ry="20" fill="#7DD3FC" opacity="0.18" filter="url(#soft)"/>

  <!-- steam ambient -->
  <ellipse cx="600"  cy="200" rx="280" ry="80" fill="#E0F2FE" opacity="0.04" filter="url(#soft)"/>
  <ellipse cx="1320" cy="160" rx="320" ry="100" fill="#E0F2FE" opacity="0.04" filter="url(#soft)"/>

  <rect width="1920" height="800" fill="#000" opacity="0.18"/>

  <g font-family="Inter, system-ui, sans-serif" fill="#374151">
    <text x="1880" y="775" font-size="14" text-anchor="end" letter-spacing="2">VANTYX · CONCEPT</text>
  </g>
</svg>
