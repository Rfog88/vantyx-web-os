<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plumber concept — matte-black faucet on dark stone counter">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="rim" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.45" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1920" height="800" fill="url(#wall)"/>
  <rect width="1920" height="800" fill="url(#rim)"/>

  <!-- backsplash tile lines -->
  <g stroke="#111827" stroke-width="1" opacity="0.45">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="260" x2="1920" y2="260"/>
    <line x1="0" y1="340" x2="1920" y2="340"/>
    <line x1="0" y1="420" x2="1920" y2="420"/>
  </g>
  <g stroke="#111827" stroke-width="1" opacity="0.3">
    <line x1="240"  y1="180" x2="240"  y2="500"/>
    <line x1="560"  y1="180" x2="560"  y2="500"/>
    <line x1="880"  y1="180" x2="880"  y2="500"/>
    <line x1="1200" y1="180" x2="1200" y2="500"/>
    <line x1="1520" y1="180" x2="1520" y2="500"/>
    <line x1="1760" y1="180" x2="1760" y2="500"/>
  </g>

  <!-- counter -->
  <rect x="0" y="500" width="1920" height="40" fill="url(#stone)"/>
  <rect x="0" y="540" width="1920" height="260" fill="#070B14"/>
  <line x1="0" y1="500" x2="1920" y2="500" stroke="#374151" stroke-width="1" opacity="0.6"/>

  <!-- sink basin (rectangular undermount) -->
  <rect x="780" y="510" width="360" height="180" rx="6" fill="#050912" stroke="#1F2937" stroke-width="2"/>
  <rect x="800" y="528" width="320" height="148" rx="4" fill="#000"/>

  <!-- faucet body (matte black, dramatic side light) -->
  <rect x="945"  y="320" width="30" height="200" fill="url(#chrome)"/>
  <path d="M945 320 q-2 -50 80 -50 h60 q60 0 60 70 v40 h-30 v-30 q0 -50 -40 -50 h-50 q-50 0 -50 30 z" fill="url(#chrome)"/>
  <rect x="1100" y="370" width="40" height="16" fill="#0F172A"/>
  <!-- handle -->
  <rect x="978"  y="290" width="16" height="40" rx="3" fill="#0F172A"/>

  <!-- water stream -->
  <rect x="1115" y="386" width="6" height="140" fill="url(#stream)"/>
  <ellipse cx="1118" cy="540" rx="20" ry="6" fill="#7DD3FC" opacity="0.35" filter="url(#soft)"/>

  <!-- chrome highlight line on faucet -->
  <rect x="947" y="320" width="2" height="200" fill="#94A3B8" opacity="0.4"/>

  <rect width="1920" height="800" fill="#000" opacity="0.20"/>

  <g font-family="Inter, system-ui, sans-serif" fill="#374151">
    <text x="1880" y="775" font-size="14" text-anchor="end" letter-spacing="2">VANTYX · CONCEPT</text>
  </g>
</svg>
